<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High-risk link warning</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(239,68,68,0.25), transparent 25%), #0f172a;
      }

      .card {
        width: min(560px, 90vw);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148,163,184,0.2);
        border-radius: 18px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.28);
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 38px);
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
        font-size: 17px;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .back {
        background: #e2e8f0;
        color: #111827;
      }

      .proceed {
        background: #dc2626;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>High-risk link warning</h1>
      <p>This destination was flagged by local heuristics as high risk and may be a scam or phishing site.</p>
      <p id="targetText">Do not continue unless you are absolutely sure the URL is legitimate.</p>

      <div class="actions">
        <button id="backBtn" class="back" type="button">Go back</button>
        <button id="proceedBtn" class="proceed" type="button">Proceed anyway</button>
      </div>
    </main>

    <script src="warning.js"></script>
  </body>
</html>
